<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>New API</title>
    <meta name="title" content="New API" />
    <meta
      name="description"
      content="Unified AI API gateway and admin dashboard."
    />

    <meta name="theme-color" content="#fff" />
    <!-- Resolve the theme before first paint so the page never flashes light
         and one-shot detectors (e.g. Dark Reader) see the real theme.
         Keep in sync with ThemeProvider and THEME_STORAGE_KEYS.mode. -->
    <script>
      ;(function () {
        var theme = 'system'
        try {
          theme = localStorage.getItem('newapi:theme:v1:mode') || 'system'
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.classList.add(theme)
      })()
    </script>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <!-- 首屏绘制前写入颜色预设，避免 React 挂载后才切换配色造成闪烁。
         需与 ThemeCustomizationProvider、DEFAULT_THEME_CUSTOMIZATION.preset、
         THEME_STORAGE_KEYS.preset 保持一致；非法值由 Provider 挂载后纠正。 -->
    <script>
      ;(function () {
        var preset = null
        try {
          preset = localStorage.getItem('newapi:theme:v1:preset')
        } catch (e) {}
        preset = preset || 'ocean-breeze'
        if (preset !== 'default') {
          document.body.setAttribute('data-theme-preset', preset)
        }
      })()
    </script>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>

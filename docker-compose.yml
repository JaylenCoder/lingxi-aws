services:
  lingxi-aws:
    image: ghcr.io/jaylencoder/lingxi-aws:${IMAGE_TAG:-latest}
    container_name: lingxi-aws
    restart: always
    command: --log-dir /app/logs
    ports:
      - "127.0.0.1:8001:3000"   # 只监听本机，外部访问统一走 Nginx；8000 已被 lingxi-azure 占用
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    env_file:
      - .env
    networks:
      - lingxi
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

networks:
  lingxi:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16   # 固定网段，供 TRUSTED_PROXIES 使用；避开 lingxi-azure 的 172.28.0.0/16
